name:  Test Build

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.arch }} with config ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    env:
      CI: "1"
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            arch: Linux-x86_64
            config: default
          - os: ubuntu-latest
            python: "3.13"
            arch: Linux-x86_64
            config: default
          - os: ubuntu-latest
            python: "3.12"
            arch: Linux-x86_64
            config: binary
          - os: macos-15
            python: "3.12"
            arch: MacOSX-arm64
            config: minimal
            continue-on-error: true
          # The ACT tools (e.g. libactpol_deps) does not compile yet on
          # macos arm64.  Disable this test for now.
          # - os: macos-15
          #   python: "3.12"
          #   arch: MacOSX-arm64
          #   config: default
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          auto-update-conda: true
          auto-activate: true
          activate-environment:  # Disable creation of the 'test' env
          extra-specs: |
            conda-build
            conda-verify

      - name: Check Conda Config
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show

      - name: Install
        run: |
          pyver=${{ matrix.python }}
          sed -i -E "s/python=3\.[[:digit:]]+.*/python=${pyver}/" ./config/${{ matrix.config }}/packages_conda.txt
          cat ./config/${{ matrix.config }}/packages_conda.txt
          ./soconda.sh -e soconda -v CI -c ${{ matrix.config }}

      - name: Run Tests
        run: |
          conda activate soconda_CI
          export OMP_NUM_THREADS=2
          export MPI_DISABLE=1
          export CI=1
          python3 -c 'import scipy; import toast'
          python3 -c 'import so3g; from spt3g import core'
          python3 -c 'from sotodlib import core'
          python3 -c 'import toast.tests; toast.tests.run()'
          sotodlib_version=`python -c 'import sotodlib; print(sotodlib.__version__)'`
          git clone --depth=1 --single-branch --branch=${sotodlib_version} https://github.com/simonsobs/sotodlib.git
          pushd sotodlib
          mkdir -p test_run
          pushd test_run
          python3 -m pytest -vv ../tests
          popd
          popd
          unset MPI_DISABLE
          unset OMP_NUM_THREADS
